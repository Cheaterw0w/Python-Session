name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile
        run: cl /std:c++20 /O2 /EHsc /MT mouselag_final.cpp /link /SUBSYSTEM:WINDOWS user32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: mouselag-exe
          path: mouselag_final.exe
