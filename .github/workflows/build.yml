name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: cmd
        run: cl /std:c++20 /O2 /EHsc /MT mouselag_final.cpp /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib advapi32.lib

      - name: Verify output
        shell: cmd
        run: dir mouselag_final.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: mouselag-exe
          path: mouselag_final.exe
          if-no-files-found: error
